</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-marpit-fragments="4" data-lang="en-US" lang="en-US" style="--lang:en-US;">
<p>Here’s an approach that works remarkably well:</p>

<ul>
<li data-marpit-fragment="1">Take a pretrained, open-weights LLM (e.g. Llama 1B)</li>
<li data-marpit-fragment="2">Take audio files with transcriptions (human or AI generated)</li>
<li data-marpit-fragment="3">Encode the audio as neural audio codec tokens</li>
<li data-marpit-fragment="4">Fine-tune the LLM!</li>
</ul>
<p class='smaller' data-marpit-fragment>
  (Cf. Llasa: Scaling Train-Time and Inference-Time Compute for Llama-based Speech Synthesis)
</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-lang="en-US" lang="en-US" style="--lang:en-US;">
<h2>Training</h2>
<pre class='nac'>
&lt;text&gt;It was the best of times, it was the worst of times&lt;/text&gt;
&lt;audio&gt;<span>🜃</span><span>🝃</span><span>🜶</span><span>🜻</span><span>🜼</span><span>🝊</span><span>🝋</span>…&lt;/audio&gt;
</pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-lang="en-US" lang="en-US" style="--lang:en-US;">
<h2>Inference</h2>
<p>Prompt:</p>
<pre class='nac'>
&lt;text&gt;Here's a brand new sentence&lt;/text&gt;
&lt;audio&gt;
</pre>
<p>Continuation:</p>
<pre class='nac'>
<i></i><i></i><span>🝤</span><span>🜱</span><span>🝣</span><span>🜲</span><span>🝊</span><span>🝢</span>…&lt;/audio&gt;
</pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-lang="en-US" lang="en-US" style="--lang:en-US;">
<h2>Voice cloning (via one-shot prompting)</h2>
<p>Prompt:</p>
<pre class='nac'>
&lt;text&gt;Get to the chopper!&lt;/text&gt;
&lt;audio&gt;<span>🝊</span><span>🝢</span><span>🜼</span><span>🝣</span><span>🝌</span><span>🜠</span>…&lt;/audio&gt;

&lt;text&gt;I'll be back&lt;/text&gt;
&lt;audio&gt;
</pre>
<p>Continuation:</p>
<pre class='nac'>
<span>🜘</span><span>🝊</span><span>🝣</span><span>🜱</span><span>🝋</span>…&lt;/audio&gt;
</pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-marpit-scope-zo8N6zTy="" data-lang="en-US" lang="en-US" style="--lang:en-US;"><div data-marpit-fragment>
  <pre class='nac'>
&lt;low-quality&gt;<i></i><span>🜻</span><span>🜶</span><span>🜃</span><span>🝊</span><span>🜉</span><span>🝋</span>&lt;/low-quality&gt;
&lt;high-quality&gt;<i></i><i></i><span>🜼</span><span>🜠</span><span>🜲</span><span>🜶</span><span>🝊</span><span>🝮</span>&lt;/high-quality&gt;</pre>
  <p>Audio enhancement</p>
</div>
<div data-marpit-fragment>
  <pre class='nac'>
&lt;audio&gt;<span>🜻</span><span>🜉</span><span>🜃</span><span>🜏</span><span>🝤</span><span>🝣</span>&lt;/audio&gt;
&lt;instruction&gt;Replace hello with hi&lt;/instruction&gt;
&lt;audio&gt;<span>🜻</span><span>🜉</span><span>🝃</span><span>🝤</span><span>🝣</span>&lt;/audio&gt;</pre>
  <p>Speech editing</p>
</div>
<div data-marpit-fragment>
  <pre class='nac'>
&lt;speech&gt;<i></i><span>🝣</span><span>🝋</span><span>🝢</span><span>🜼</span><span>🝌</span><span>🝮</span>&lt;/speech&gt;
&lt;rap&gt;<i></i><i></i><i></i><i></i><span>🜲</span><span>🜉</span><span>🜼</span><span>🜃</span><span>🝌</span><span>🜘</span>&lt;/rap&gt;</pre>
  <p>Speech-to-rap</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-marpit-fragments="7" data-lang="en-US" lang="en-US" style="--lang:en-US;">
<h2>The recipe</h2>

<ul>
<li data-marpit-fragment="1">Assemble your dataset</li>
<li data-marpit-fragment="2">Choose your LLM
<ul>
<li data-marpit-fragment="3">LLASA = Llama 1B/8B, VibeVoice = Qwen 2.5 1B/7B, OmniVoice = Qwen 3 0.6B</li>
</ul>
</li>
<li data-marpit-fragment="4">Choose your neural audio codec</li>
<li data-marpit-fragment="5">Choose your training method (full fine tune, LoRA, DoRA, adapter, …)</li>
<li data-marpit-fragment="6">Order-of-magnitude training costs $100s - $1000s
<ul>
<li data-marpit-fragment="7">Less if you fine-tune from a foundation audio model for your task</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-marpit-scope-paExtNKy="" data-lang="en-US" lang="en-US" style="--lang:en-US;">
<h1>Leverage <em>diffusion</em> techniques</h1>
<h2>(or flow matching)</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-marpit-scope-yKTcB44o="" data-lang="en-US" lang="en-US" style="--lang:en-US;">
<h2>Denoising diffusion: the intuition</h2>
<div class="diffusion-intuition">
  <div class="diffusion-fragment">
    <img class="diffusion-original" src="/assets/images/talks/generative-audio/ecce-a.jpg" alt="" />

<h2>Advantage: naturally tends to generate clean outputs</h2>

<ul>
<li data-marpit-fragment="1">Diffusion models generate by denoising</li>
<li data-marpit-fragment="2">So they tend to be good add producing clean, sharp outputs</li>
<li data-marpit-fragment="3">Good for avoiding audio artifacts</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-marpit-scope-H2akFw5X="" data-lang="en-US" lang="en-US" style="--lang:en-US;">
<h2>Advantage: CFG for control</h2>

  <div class="cfg-label cfg-high">High CFG</div>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-marpit-fragments="3" data-lang="en-US" lang="en-US" style="--lang:en-US;">
<h2>Diffusion for audio</h2>

<ul>
<li data-marpit-fragment="1">Modify or mask (delete) audio tokens</li>
<li data-marpit-fragment="2">Or, introduce noise elsewhere (into the waveform or spectrogram)</li>
<li data-marpit-fragment="3">Then reconstruct clean audio</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-marpit-scope-1TQUV0zR="" data-lang="en-US" lang="en-US" style="--lang:en-US;">

<h2>LLM vs. Diffusion</h2>
<ul>
<li>We can use pure diffusion</li>
<li>Or we can use pure LLM-backed generation</li>
<li>Most frontier models use a <em>combination</em></li>
</ul>
</section>
